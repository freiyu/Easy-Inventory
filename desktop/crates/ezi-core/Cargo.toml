[package]
name = "ezi-core"
description = "EZI desktop client logic with no UI dependency"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain http only (no TLS feature): the EZI server speaks http on the office LAN, so no TLS stack and no C build step.
ureq = { version = "3", default-features = false }
# Writes the barcode PNG file (already in the lock file through the UI library, so no new download).
png = "0.17"

[dev-dependencies]
# A real HTTP server on a random local port stands in for the EZI server in the tests.
tiny_http = "0.12"
# An independent barcode reader (a port of ZXing): decodes what the encoder draws, so a wrong table or checksum shows up.
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }
